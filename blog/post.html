<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post - Praveen Sundar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <style>
    :root {
      --accent: #ff5000;
      --bg: #ffffff;
      --text: #0a0a0a;
      --muted: #888888;
      --line: #e8e8e8;
      --nav-h: 56px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 48px);
      background: var(--bg);
      border-bottom: 1px solid #ebebeb;
    }
    .back-blog {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s ease;
    }
    .back-blog:hover { color: var(--accent); }
    .topbar-right {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    main { padding-top: calc(var(--nav-h) + 28px); }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 clamp(20px, 4vw, 48px) 72px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tag {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(255, 80, 0, 0.35);
      padding: 4px 10px;
    }
    .title {
      font-weight: 800;
      font-size: clamp(26px, 4.5vw, 36px);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 12px;
      position: relative;
    }
    .title::after {
      content: '';
      display: block;
      height: 2px;
      width: 100%;
      margin-top: 12px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 40%, #ffb088 50%, var(--accent) 60%, transparent 100%);
      background-size: 220% 100%;
      animation: titleShimmer 4.5s ease-in-out infinite;
    }
    @keyframes titleShimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 36px;
    }
    .post-hero { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; object-position: center 28%; display: block; margin: 0 0 42px; border: 1px solid #202323; background: #0b0d0e; }

    .md {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
      font-weight: 300;
      font-size: 17px;
      line-height: 1.85;
      color: #333;
    }
    .md > * + * { margin-top: 1.05em; }
    .md h1 {
      font-weight: 800;
      font-size: 26px;
      margin-top: 1.4em;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent);
    }
    .md h2, .md h3 {
      font-weight: 700;
      margin-top: 1.35em;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--accent);
    }
    .md h2 { font-size: 20px; }
    .md h3 { font-size: 17px; }
    .md a {
      color: var(--accent);
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 80, 0, 0.35);
      transition: border-color 0.25s ease, color 0.25s ease;
      background-image: linear-gradient(var(--accent), var(--accent));
      background-position: 0 100%;
      background-repeat: no-repeat;
      background-size: 0 1px;
    }
    .md a:hover {
      border-color: var(--accent);
      background-size: 100% 1px;
    }
    .md blockquote {
      border-left: 3px solid var(--accent);
      padding: 12px 18px;
      margin: 1.2em 0;
      background: #fafafa;
      color: #444;
    }
    .md .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 1.4em 0; }
    .md .stat { padding: 16px; background: #0b0d0e; color: #fff; border-top: 3px solid var(--accent); }
    .md .stat strong { display: block; font-size: 25px; letter-spacing: -0.04em; color: #fff; }
    .md .stat span { display: block; margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.08em; color: #aeb2b2; }
    .md .source-note { font-size: 13px; line-height: 1.65; color: #777; border-top: 1px solid var(--line); padding-top: 18px; }
    .md .pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 1.5em 0; }
    .md .pipeline-step { position: relative; min-height: 128px; padding: 14px 12px; background: #f4f1ed; border-top: 3px solid #0b0d0e; }
    .md .pipeline-step:not(:last-child)::after { content: '>'; position: absolute; z-index: 2; right: -12px; top: 45px; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 18px; }
    .md .pipeline-num { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: .1em; }
    .md .pipeline-step strong { display: block; margin-top: 18px; font-size: 15px; line-height: 1.2; }
    .md .pipeline-step span:last-child { display: block; margin-top: 6px; font-size: 12px; line-height: 1.4; color: #666; }
    .md .decision-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 1.5em 0; background: #d9d5cf; border: 1px solid #d9d5cf; }
    .md .decision-panel > div { padding: 18px; background: #0b0d0e; color: #fff; }
    .md .decision-panel strong { display: block; margin-bottom: 7px; font-size: 16px; }
    .md .decision-panel span { display: block; color: #b7b9b9; font-size: 13px; line-height: 1.5; }
    .md pre {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 13px;
      line-height: 1.55;
      background: #0a0a0a;
      color: #f2f2f2;
      padding: 16px 18px;
      overflow-x: auto;
      border: 1px solid #111;
    }
    .md code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.88em;
      background: #f4f4f4;
      border: 1px solid var(--line);
      padding: 2px 6px;
    }
    .md pre code { background: none; border: none; padding: 0; }

    .md img {
      max-width: min(720px, 100%);
      margin: 32px auto;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: block;
      object-fit: cover;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .md img:hover {
      transform: scale(1.015);
      box-shadow: 0 8px 28px rgba(0,0,0,0.18);
    }
    .post-hero {
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .post-hero:hover {
      transform: scale(1.01);
      box-shadow: 0 8px 28px rgba(0,0,0,0.12);
    }

    .md > p,
    .md > h1,
    .md > h2,
    .md > h3,
    .md > blockquote,
    .md > figure,
    .md > img,
    .md > ul,
    .md > ol,
    .md > pre,
    .md > div,
    .post-hero {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .md > p.is-visible,
    .md > h1.is-visible,
    .md > h2.is-visible,
    .md > h3.is-visible,
    .md > blockquote.is-visible,
    .md > figure.is-visible,
    .md > img.is-visible,
    .md > ul.is-visible,
    .md > ol.is-visible,
    .md > pre.is-visible,
    .md > div.is-visible,
    .post-hero.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .post-hero.is-visible:hover {
      transform: scale(1.01);
    }
    .md > img.is-visible:hover {
      transform: scale(1.015);
    }
    .md figure.is-visible img:hover {
      transform: scale(1.015);
    }

    @media (prefers-reduced-motion: reduce) {
      .title::after { animation: none; background-position: 50% 0; }
      .md > p,
      .md > h1,
      .md > h2,
      .md > h3,
      .md > blockquote,
      .md > figure,
      .md > img,
      .md > ul,
      .md > ol,
      .md > pre,
      .md > div,
      .post-hero {
        opacity: 1;
        transform: none;
        transition: none;
      }
      .md img:hover,
      .post-hero:hover { transform: none; }
      .md a { background-size: 0 0; }
    }
    .md figure {
      max-width: min(720px, 100%);
      margin: 32px auto;
    }
    .md figcaption {
      font-size: 14px;
      font-style: italic;
      color: #888;
      text-align: center;
      margin-top: 10px;
      line-height: 1.4;
    }

    .panel {
      margin-top: 44px;
      padding-top: 32px;
      border-top: 1px solid #ebebeb;
    }
    .panel h2 {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .like-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      color: #333;
      transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .like-btn:hover:not(:disabled) {
      border-color: rgba(255, 80, 0, 0.45);
      transform: scale(1.04);
      color: var(--accent);
      box-shadow: 0 8px 24px rgba(255, 80, 0, 0.1);
    }
    .like-btn:disabled {
      cursor: default;
      opacity: 1;
    }
    .like-btn.is-liked {
      border-color: rgba(255, 80, 0, 0.4);
      background: #fff8f4;
      color: var(--accent);
    }
    .like-btn.is-pulsing {
      animation: like-pulse 0.45s ease;
    }
    @keyframes like-pulse {
      0% { transform: scale(1); }
      35% { transform: scale(1.14); }
      70% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }
    .like-ic {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      transition: transform 0.2s ease;
    }
    .like-ic svg { display: block; }
    .like-btn:hover:not(:disabled) .like-ic { transform: scale(1.08); }
    .like-count {
      min-width: 28px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #0a0a0a;
      color: #fff;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1;
      text-align: center;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .like-btn.is-liked .like-count,
    .like-btn:hover:not(:disabled) .like-count {
      background: var(--accent);
      color: #fff;
    }

    .comments { margin-top: 8px; }
    .comment-list {
      display: grid;
      gap: 0;
      margin: 0 0 28px;
    }
    .comment {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 14px;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }
    .comment:first-child { padding-top: 4px; }
    .comment:last-child { border-bottom: none; }
    .comment-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #fff;
      background: var(--accent);
      flex-shrink: 0;
      user-select: none;
    }
    .comment-body { min-width: 0; }
    .comment-top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 14px;
      margin-bottom: 8px;
    }
    .comment-name {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .comment-ts {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: #aaa;
    }
    .comment-msg {
      font-weight: 300;
      font-size: 15px;
      line-height: 1.65;
      color: #333;
      white-space: pre-wrap;
    }
    .comment-empty {
      font-weight: 300;
      font-size: 14px;
      color: #888;
      padding: 8px 0 20px;
    }

    .comment-composer {
      border: 1px solid var(--line);
      background: #fff;
      padding: 18px;
      display: grid;
      gap: 14px;
    }
    .comment-composer-fields {
      display: grid;
      gap: 10px;
    }
    .comment-composer input,
    .comment-composer textarea {
      width: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 300;
      color: var(--text);
      background: #fafafa;
      border: 1px solid transparent;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .comment-composer input:focus,
    .comment-composer textarea:focus {
      background: #fff;
      border-color: rgba(255, 80, 0, 0.45);
    }
    .comment-composer input::placeholder,
    .comment-composer textarea::placeholder {
      color: #aaa;
      font-weight: 300;
    }
    .comment-composer textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }
    .comment-composer-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
    }
    .comment-submit {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 22px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .comment-submit:hover {
      background: #e04800;
      transform: translateY(-1px);
    }
    .comment-hint {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #bbb;
    }
    .form-err { color: #b42318; font-size: 13px; }

    .err {
      padding: 14px;
      border: 1px solid #f3b19a;
      background: #fff5f0;
      color: #7a2e0e;
      margin-bottom: 20px;
    }
    @media (max-width: 640px) {
      .post-hero { aspect-ratio: 4 / 3; margin-bottom: 30px; object-position: center 28%; }
      .md .stat-grid { grid-template-columns: 1fr; }
      .md .pipeline { grid-template-columns: 1fr 1fr; }
      .md .pipeline-step:not(:last-child)::after { content: none; }
      .md .decision-panel { grid-template-columns: 1fr; }
      .md { font-size: 16px; line-height: 1.75; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back-blog" href="/blog/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Blog
    </a>
    <span class="topbar-right">Post</span>
  </header>

  <main>
    <div class="wrap">
      <p class="err" id="err" hidden></p>
      <article id="root" hidden>
        <div class="tags" id="tags"></div>
        <h1 class="title" id="title"></h1>
        <div class="meta" id="meta">
          <span id="date"></span>
          <span id="authors" hidden></span>
          <span id="read"></span>
        </div>
        <div class="md" id="md"></div>

        <section class="panel" id="reaction-panel" aria-labelledby="lk">
          <h2 id="lk">Likes</h2>
          <button type="button" class="like-btn" id="like-btn" aria-pressed="false" aria-label="Like this post">
            <span class="like-ic" id="like-ic" aria-hidden="true"></span>
            <span class="like-count" id="like-n">0</span>
          </button>
          <p class="form-err" id="like-err" hidden></p>
        </section>

        <section class="panel" id="comment-panel" aria-labelledby="cm">
          <h2 id="cm">Comments</h2>
          <div class="comments">
            <div class="comment-list" id="clist"></div>
            <form class="comment-composer" id="cform">
              <div class="comment-composer-fields">
                <input type="text" id="cname" name="author_name" maxlength="100" autocomplete="name" placeholder="Name (optional)" />
                <textarea id="cmsg" name="message" maxlength="2000" required placeholder="Write a comment…"></textarea>
              </div>
              <input type="text" id="cwebsite" name="website" value="" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;height:0;width:0;opacity:0;pointer-events:none;" />
              <div class="comment-composer-actions">
                <button type="submit" class="comment-submit">Post Comment</button>
                <span class="comment-hint">Name optional</span>
                <span class="form-err" id="cerr" hidden></span>
              </div>
            </form>
          </div>
        </section>
      </article>
    </div>
  </main>

  <script>
  (function () {
    var API_BASE = window.BLOG_API_BASE || 'https://c2ece0ad-4b2d-4af4-ae65-1b07660550dc.thelearnchain.com/blog-api';
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug');
    var err = document.getElementById('err');
    var root = document.getElementById('root');
    var likeKey = slug ? 'liked_' + slug : '';
    var fpKey = 'blog_fp';

    function heartOut() {
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12.1 20.55l-.1.1-.11-.1C7.14 16.24 4 13.39 4 10.2 4 7.9 5.8 6.1 8.1 6.1c1.34 0 2.63.64 3.4 1.64.77-1 2.06-1.64 3.4-1.64 2.3 0 4.1 1.8 4.1 4.1 0 3.19-3.14 6.04-7.9 10.35Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
    }
    function heartIn() {
      return '<svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M12.1 20.55l-.1.1-.11-.1C7.14 16.24 4 13.39 4 10.2 4 7.9 5.8 6.1 8.1 6.1c1.34 0 2.63.64 3.4 1.64.77-1 2.06-1.64 3.4-1.64 2.3 0 4.1 1.8 4.1 4.1 0 3.19-3.14 6.04-7.9 10.35Z"/></svg>';
    }

    function initials(name) {
      var parts = String(name || 'A').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return 'A';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function avatarTone(name) {
      var tones = ['#FF5000', '#0A0A0A', '#E04800', '#333333', '#C2410C'];
      var s = String(name || 'A');
      var h = 0;
      for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return tones[h % tones.length];
    }

    function fmtTs(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      var now = Date.now();
      var diff = Math.max(0, now - d.getTime());
      var mins = Math.floor(diff / 60000);
      if (mins < 1) return 'Just now';
      if (mins < 60) return mins + 'm ago';
      var hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      var days = Math.floor(hrs / 24);
      if (days < 7) return days + 'd ago';
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function getFingerprint() {
      try {
        var existing = window.localStorage.getItem(fpKey);
        if (existing) return existing;
        var fp = 'fp_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        window.localStorage.setItem(fpKey, fp);
        return fp;
      } catch (e) {
        return 'anon';
      }
    }

    function apiErrorMessage(j, status) {
      if (!j) return 'HTTP ' + status;
      if (typeof j.detail === 'string') return j.detail;
      if (j.error) return j.error;
      if (j.message) return j.message;
      return 'HTTP ' + status;
    }

    function readMin(md, fallback) {
      var w = String(md || '').trim().split(/\s+/).filter(Boolean).length;
      var m = Math.max(1, Math.ceil(w / 200));
      return typeof fallback === 'number' && fallback > 0 ? fallback : m;
    }

    function mdUrl(p) {
      if (p.filepath) return p.filepath;
      return '/posts/' + encodeURIComponent(p.filename || '');
    }

    function readJsonResponse(r) {
      return r.text().then(function (t) {
        var j = null;
        try {
          j = t ? JSON.parse(t) : null;
        } catch (e) {
          j = null;
        }
        if (!r.ok) {
          var errObj = new Error(apiErrorMessage(j, r.status));
          errObj.body = j;
          throw errObj;
        }
        return j;
      });
    }

    if (!slug) {
      err.hidden = false;
      err.textContent = 'Missing slug in URL.';
      return;
    }

    var liked = window.localStorage.getItem(likeKey) === '1';
    var reactionPanel = document.getElementById('reaction-panel');
    var commentPanel = document.getElementById('comment-panel');
    var likeBtn = document.getElementById('like-btn');
    var likeIc = document.getElementById('like-ic');
    var likeN = document.getElementById('like-n');

    function paintLike(count, pulse) {
      likeN.textContent = String(count);
      likeIc.innerHTML = liked ? heartIn() : heartOut();
      likeBtn.classList.toggle('is-liked', liked);
      likeBtn.setAttribute('aria-pressed', liked ? 'true' : 'false');
      likeBtn.disabled = liked;
      if (pulse) {
        likeBtn.classList.remove('is-pulsing');
        void likeBtn.offsetWidth;
        likeBtn.classList.add('is-pulsing');
        window.setTimeout(function () {
          likeBtn.classList.remove('is-pulsing');
        }, 450);
      }
    }

    function loadLikes() {
      var le = document.getElementById('like-err');
      if (le) { le.hidden = true; le.textContent = ''; }
      return fetch(API_BASE + '/api/likes?slug=' + encodeURIComponent(slug))
        .then(readJsonResponse)
        .then(function (d) {
          paintLike(typeof d.count === 'number' ? d.count : 0);
        })
        .catch(function (e) {
          if (le) {
            le.hidden = false;
            le.textContent = (e && e.message) ? e.message : 'Could not load likes.';
          }
          paintLike(0);
        });
    }

    likeBtn.addEventListener('click', function () {
      if (liked) return;
      var le = document.getElementById('like-err');
      if (le) { le.hidden = true; le.textContent = ''; }
      var fp = getFingerprint();
      fetch(API_BASE + '/api/likes?slug=' + encodeURIComponent(slug), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Fingerprint': fp
        },
        body: JSON.stringify({ fingerprint: fp })
      })
        .then(readJsonResponse)
        .then(function (d) {
          liked = true;
          try { window.localStorage.setItem(likeKey, '1'); } catch (e) {}
          paintLike(typeof d.count === 'number' ? d.count : parseInt(likeN.textContent, 10) + 1, true);
        })
        .catch(function (e) {
          if (le) {
            le.hidden = false;
            le.textContent = (e && e.message) ? e.message : 'Could not save like.';
          }
        });
    });

    var clist = document.getElementById('clist');
    function renderComments(arr) {
      clist.innerHTML = '';
      if (!arr.length) {
        var p = document.createElement('p');
        p.className = 'comment-empty';
        p.textContent = 'No comments yet. Be the first.';
        clist.appendChild(p);
        return;
      }
      arr.forEach(function (c) {
        var name = c.author_name || c.name || 'Anonymous';
        var card = document.createElement('div');
        card.className = 'comment';

        var avatar = document.createElement('div');
        avatar.className = 'comment-avatar';
        avatar.style.background = avatarTone(name);
        avatar.textContent = initials(name);
        avatar.setAttribute('aria-hidden', 'true');

        var body = document.createElement('div');
        body.className = 'comment-body';

        var top = document.createElement('div');
        top.className = 'comment-top';
        var n = document.createElement('span');
        n.className = 'comment-name';
        n.textContent = name;
        var t = document.createElement('span');
        t.className = 'comment-ts';
        t.textContent = fmtTs(c.created_at || c.timestamp);
        top.appendChild(n);
        top.appendChild(t);

        var m = document.createElement('div');
        m.className = 'comment-msg';
        m.textContent = c.message;

        body.appendChild(top);
        body.appendChild(m);
        card.appendChild(avatar);
        card.appendChild(body);
        clist.appendChild(card);
      });
    }

    function loadComments() {
      var ce = document.getElementById('cerr');
      return fetch(API_BASE + '/api/comments?slug=' + encodeURIComponent(slug))
        .then(readJsonResponse)
        .then(function (d) { renderComments(Array.isArray(d) ? d : []); })
        .catch(function (e) {
          renderComments([]);
          if (ce) {
            ce.hidden = false;
            ce.textContent = (e && e.message) ? e.message : 'Could not load comments.';
          }
        });
    }

    document.getElementById('cform').addEventListener('submit', function (e) {
      e.preventDefault();
      var ce = document.getElementById('cerr');
      ce.hidden = true;
      var name = document.getElementById('cname').value.trim() || 'Anonymous';
      var message = document.getElementById('cmsg').value.trim();
      var website = document.getElementById('cwebsite').value;
      if (!message) {
        ce.hidden = false;
        ce.textContent = 'Message is required.';
        return;
      }
      fetch(API_BASE + '/api/comments?slug=' + encodeURIComponent(slug), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          author_name: name,
          message: message,
          website: website
        }),
      })
        .then(readJsonResponse)
        .then(function () {
          document.getElementById('cname').value = '';
          document.getElementById('cmsg').value = '';
          document.getElementById('cwebsite').value = '';
          return loadComments();
        })
        .catch(function (x) {
          ce.hidden = false;
          ce.textContent = (x && x.message) ? x.message : 'Could not post.';
        });
    });

    fetch('/posts.json')
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function (posts) {
        var post = null;
        if (Array.isArray(posts)) {
          for (var i = 0; i < posts.length; i++) {
            if (posts[i].slug === slug) { post = posts[i]; break; }
          }
        }
        if (!post) throw new Error();
        return fetch(mdUrl(post)).then(function (r) {
          if (!r.ok) throw new Error();
          return r.text().then(function (md) { return { post: post, md: md }; });
        });
      })
      .then(function (b) {
        var post = b.post;
        var md = b.md;
        document.title = post.title + ' - Blog';
        document.getElementById('title').textContent = post.title;
        document.getElementById('date').textContent = new Date(post.date + 'T12:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('read').textContent = readMin(md, post.readTime) + ' min read';
        var authors = Array.isArray(post.authors) ? post.authors : (post.author ? [post.author] : []);
        if (authors.length) {
          var authorEl = document.getElementById('authors');
          authorEl.textContent = 'By ' + authors.join(' and ');
          authorEl.hidden = false;
        }

        var hero = document.createElement('img');
        hero.className = 'post-hero';
        hero.src = post.image || post.thumbnail || '';
        hero.alt = '';
        hero.loading = 'eager';
        hero.decoding = 'async';
        hero.onerror = function () { hero.remove(); };
        document.getElementById('meta').after(hero);

        var th = document.getElementById('tags');
        th.innerHTML = '';
        (post.tags || []).forEach(function (t) {
          var s = document.createElement('span');
          s.className = 'tag';
          s.textContent = t;
          th.appendChild(s);
        });

        var body = md.replace(/^\s*#[^\n]+\n+/, '');
        document.getElementById('md').innerHTML = marked.parse(body);

        document.querySelectorAll('.md img').forEach(function(img) {
          var alt = img.getAttribute('alt');
          if (alt && alt.trim()) {
            var figure = document.createElement('figure');
            figure.appendChild(img.cloneNode(true));
            var caption = document.createElement('figcaption');
            caption.textContent = alt;
            figure.appendChild(caption);
            img.replaceWith(figure);
          }
        });

        (function revealOnScroll() {
          var nodes = document.querySelectorAll('.md > p, .md > h1, .md > h2, .md > h3, .md > blockquote, .md > figure, .md > img, .md > ul, .md > ol, .md > pre, .md > div, .post-hero');
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            nodes.forEach(function (el) { el.classList.add('is-visible'); });
            return;
          }
          if (!('IntersectionObserver' in window)) {
            nodes.forEach(function (el) { el.classList.add('is-visible'); });
            return;
          }
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
              if (en.isIntersecting) {
                en.target.classList.add('is-visible');
                io.unobserve(en.target);
              }
            });
          }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
          nodes.forEach(function (el) { io.observe(el); });
        })();

        root.hidden = false;
        liked = window.localStorage.getItem(likeKey) === '1';
        likeN.textContent = '0';
        paintLike(0);
        return Promise.all([loadLikes(), loadComments()]);
      })
      .catch(function () {
        err.hidden = false;
        err.textContent = 'Could not load this post.';
      });
  })();
  </script>
